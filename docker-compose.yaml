services:
  auth-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./auth/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  users-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: usersuser
      POSTGRES_PASSWORD: userspass
      POSTGRES_DB: usersdb
    ports:
      - "5433:5432"
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
      - ./users/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://authuser:authpass@auth-postgres:5432/authdb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: secret-key
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      - auth-postgres
      - redis
    volumes:
      - ./auth/src:/app/src
      - auth-node-modules:/app/node_modules

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://usersuser:userspass@users-postgres:5432/usersdb
    depends_on:
      - users-postgres
    volumes:
      - ./users/src:/app/src
      - users-node-modules:/app/node_modules

  garmin-connect:
    build:
      context: ./garmin-connect
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      USER_SERVICE_URL: http://users:3002
    depends_on:
      - users
    volumes:
      - ./garmin-connect:/app
      - garmin-connect-node-modules:/app/node_modules

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      JWT_SECRET: secret-key
      AUTH_SERVICE_URL: http://auth:3000
      USERS_SERVICE_URL: http://users:3002
      GARMIN_SERVICE_URL: http://garmin-connect:3003
    depends_on:
      - redis
      - auth
      - users
      - garmin-connect
    volumes:
      - ./gateway/src:/app/src
      - gateway-node-modules:/app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:3001
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
      - ./client/tsconfig.app.json:/app/tsconfig.app.json
      - ./client/tsconfig.node.json:/app/tsconfig.node.json
      - client-node-modules:/app/node_modules
    depends_on:
      - gateway

volumes:
  auth-postgres-data:
  users-postgres-data:
  redis-data:
  auth-node-modules:
  users-node-modules:
  gateway-node-modules:
  garmin-connect-node-modules:
  client-node-modules:
